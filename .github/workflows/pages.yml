name: Deploy documentation site

on:
  workflow_run:
    workflows: [Release checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Require main for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Verify release checks for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-check.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const passed = data.workflow_runs.some((run) =>
              run.head_sha === context.sha && run.conclusion === 'success'
            );
            if (!passed) core.setFailed(`Release checks have not succeeded for ${context.sha}`);
      - name: Select verified revision
        id: revision
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/trial/.playwright
    defaults:
      run:
        working-directory: trial
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trial/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build catalogue and Storybook
        run: node scripts/build-site.mjs --base-path "${{ steps.pages.outputs.base_path || '/' }}"
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify assembled site
        run: node scripts/check-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: trial/site-dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
