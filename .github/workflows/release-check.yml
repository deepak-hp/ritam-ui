name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trial
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/trial/.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trial/package-lock.json
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check:release
